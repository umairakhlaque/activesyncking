app            = "syncguard-adminsvc"
primary_region = "lhr"

[build]
  dockerfile = "deploy/docker/Dockerfile.adminsvc"

[env]
  SYNCGUARD_ADMIN_LISTEN       = ":8090"
  SYNCGUARD_ADMIN_CORS_ORIGINS = "*"
  SYNCGUARD_DB_SSLMODE         = "require"
  SYNCGUARD_DB_MIN_CONNS       = "0"

[http_service]
  internal_port        = 8090
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

[[http_service.checks]]
  interval     = "15s"
  timeout      = "5s"
  grace_period = "60s"
  method       = "GET"
  path         = "/healthz"
